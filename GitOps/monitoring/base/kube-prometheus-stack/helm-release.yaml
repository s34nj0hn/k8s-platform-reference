apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 70.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  values:
    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
    grafana:
      enabled: true
      defaultDashboardsTimezone: browser
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
      service:
        type: ClusterIP
    # On single-node K3s the kubelet and the apiserver are the same process, so the
    # kubelet /metrics endpoint re-exposes the entire apiserver and etcd registry.
    # kube-prometheus-stack scrapes both targets, storing every apiserver histogram
    # bucket twice. Dropping the duplicates from the kubelet target costs no data
    # because the apiserver target still provides them.
    kubelet:
      serviceMonitor:
        metricRelabelings:
          - sourceLabels: [__name__]
            action: drop
            regex: (apiserver|etcd|workqueue)_.*_bucket
    # These three are high-cardinality and unused by the bundled dashboards.
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          - sourceLabels: [__name__]
            action: drop
            regex: apiserver_(request_body_size_bytes|watch_events_sizes|watch_cache_read_wait_seconds)_bucket
    prometheus:
      prometheusSpec:
        # Raised from 2d once cardinality dropped. 2d was too short to diagnose a
        # multi-week memory trend, which is the reason this change exists.
        retention: 7d
        retentionSize: 4GiB
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          # Prometheus previously ran with no ceiling and reached 750Mi on a 3.9Gi
          # node. The limit bounds the blast radius to the pod instead of the node.
          limits:
            memory: 900Mi
    prometheusOperator:
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
    # Flux 2.x controllers do not export a Ready-condition metric. Following Flux's
    # monitoring guide, kube-state-metrics reads Ready from the Flux objects and
    # exports gotk_<kind>_info{ready="True|False|Unknown"}. Each kind needs its own
    # metric name because kube-state-metrics v2.15.0 emits only one resource's series
    # when several share a name. The public heartbeat's flux_ready reads these.
    kube-state-metrics:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - helmrepositories
              - kustomizations
              - helmreleases
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository}
                metricNamePrefix: gotk_gitrepository
                labelsFromPath:
                  name: [metadata, name]
                  exported_namespace: [metadata, namespace]
                metrics:
                  - name: info
                    help: Ready status of a Flux object.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          ready: [status, conditions, "[type=Ready]", status]
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository}
                metricNamePrefix: gotk_helmrepository
                labelsFromPath:
                  name: [metadata, name]
                  exported_namespace: [metadata, namespace]
                metrics:
                  - name: info
                    help: Ready status of a Flux object.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          ready: [status, conditions, "[type=Ready]", status]
              - groupVersionKind: {group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization}
                metricNamePrefix: gotk_kustomization
                labelsFromPath:
                  name: [metadata, name]
                  exported_namespace: [metadata, namespace]
                metrics:
                  - name: info
                    help: Ready status of a Flux object.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          ready: [status, conditions, "[type=Ready]", status]
              - groupVersionKind: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease}
                metricNamePrefix: gotk_helmrelease
                labelsFromPath:
                  name: [metadata, name]
                  exported_namespace: [metadata, namespace]
                metrics:
                  - name: info
                    help: Ready status of a Flux object.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          ready: [status, conditions, "[type=Ready]", status]
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi

name = "public-telemetry"
main = "src/index.ts"
compatibility_date = "2026-05-26"

routes = [
  { pattern = "api.s34nj0hn.dev", custom_domain = true }
]

[vars]
CACHE_TTL_SECONDS = "30"

# Bounds how often a single client IP can reach the heartbeat. The 30 second
# response cache already bounds normal load on Grafana; this bounds the abuse
# case. Only 10 and 60 are valid values for period.
[[ratelimits]]
binding = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
